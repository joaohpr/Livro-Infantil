<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro Digital de Letras</title>
    <script src="scripts/lib/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('img/background.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            font-family: 'Baloo 2', sans-serif;
        }

        
        #texto-topo {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;

            width: fit-content;
            margin: 0 auto;
            background-color: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
            font-size: 24px;
            font-weight: 600;
            color: black;
        }

        #nome-letra-atual {
            font-weight: 800;
            color: #b23a48;
        }

        
        #area-central {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        
        #letra-slot {
            width: 260px;
            height: 260px;
            display: none;
            
            align-items: center;
            justify-content: center;
        }

        #letra-slot.mostrar {
            display: flex;
        }

        #letra-imagem {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;

            background-color: whitesmoke;
            border: 6px solid black;
            border-radius: 16px;
            box-shadow: 0px 4px 12px black;
            padding: 10px;
        }

       
        #imagem-slot {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #modal-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;

            background-color: whitesmoke;
            border: 6px solid black;
            border-radius: 16px;
            box-shadow: 0px 4px 12px black;
            padding: 10px;
            display: none;
        }

        #modal-image.mostrar {
            display: block;
        }
    </style>
</head>

<body>

    <div id="texto-topo">
        <span>Pressione uma tecla :</span>
        <span id="nome-letra-atual"></span>
    </div>

    <div id="area-central">
        <div id="letra-slot">
            <img src="" alt="" id="letra-imagem">
        </div>

        <div id="imagem-slot">
            <img src="" alt="" id="modal-image">
        </div>
    </div>

    <script src="scripts/script.js"></script>
</body>

</html>
